<!DOCTYPE html>
<html >
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
  
  
    <link hfef ="css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
</head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workshop #HTML - FORM</title>
  <style>
        .custom-label {
            margin-right: 170px;
        }
        .p{
          color: red;
        }
        .custom-label-utima{
          margin-right: 950px
        }
    </style>
</head>
<body>
  <div class="container mt-5">
    <form>
       <div class="form-group row align-items-center">
        <label for="name" class="col-sm-2 col-form-label text-left custom-label">ชื่อ<span class="p">*</span></label>
        <div class="col-sm-8">
            <input type="text" class="form-control" id="name" placeholder="ชื่อ">
        </div>
    </div>

        <div class="form-group row align-items-center">
          <label for="surname" class="col-sm-2 col-form-label text-left custom-label">สกุล</label>
          <div class="col-sm-8">
              <input type="text" class="form-control" id="surname">
          </div>
        </div>
        <div class="form-group row alight-items-center">
          <label for="dob" class="col-sm-2 col-form-label text-left custom-label">วัน/เดือน/ปีเกิด</label>
          <div class ="col-sm-8">
            <input type="date" class="form-control" id="dob">
        </div>
      </div>
        <div class="form-group row alight-items-center">
          <label for="age" class="col-sm-2 col-form-label text-left custom-label">อายุ</label>
          <div class ="col-sm-8">
            <input type="text" class="form-control" id="age">
        </div>
      </div>
      <div class="form-group row">
        <label class="col-sm-2 col-form-label text-left custom-label">เพศ</label>
        <div class="col-sm-8">
            <div class="form-check ">
                <input class="form-check-input" type="radio" name="gender" id="male" value="male">
                <label class="form-check-label" for="male">ชาย</label>
            </div>
            <div class="form-check mt-2">
                <input class="form-check-input" type="radio" name="gender" id="female" value="female">
                <label class="form-check-label" for="female">หญิง</label>
            </div>
        </div>
    </div>
      
        <div class="form-group row alight-items-center">
            <label for="file" class="col-sm-2 col-form-label text-left custom-label">รูป</label>
            <div class="col-sm-8">
            <input type="file" class="form-control-file" id="file">
        </div>
      </div>
        <div class="form-group row alight-items-center">
            <label for="address" class="col-sm-2 col-form-label text-left custom-label">ที่อยู่</label>
            <div class="col-sm-8">
            <textarea class="form-control" id="address" rows="3"></textarea>
        </div>
        </div>
        <div class="form-group row alight-items-center">
            <label for="favoriteColor" class="col-sm-2 col-form-label text-left custom-label">สีที่ชอบ</label>
            <div class="col-sm-8">
            <input type="text" class="form-control" id="favoriteColor" placeholder="สีแดง">
        </div>
        </div>
        <div class="form-group row">
        <label class="col-sm-2 col-form-label text-left custom-label">เพลงที่ชอบ</label>
        <div class="col-sm-8">
        <div class="form-check">
            <input type="radio" class="form-check-input" name="song" id="pop">
            <label class="form-check-label" for="pop">เพื่อชีวิต</label>
        </div>
        <div class="form-check">
            <input type="radio" class="form-check-input" name="song" id="folk">
            <label class="form-check-label" for="folk">ลูกทุ่ง</label>
        </div>
        <div class="form-check">
            <input type="radio" class="form-check-input" name="song" id="others">
            <label class="form-check-label" for="others">อื่นๆ</label>
        </div>
      </div>
    </div>
        <div class="form-check mt-3">
            <input type="checkbox" class="form-check-input" id="consent">
            <label class="form-check-label" for="consent">ยินยอมให้เก็บข้อมูล</label>
        </div>
        <div class="mt-4">
            <button type="reset" class="btn btn-secondary custom-label-utima">Reset</button>
            <button type="submit" class="btn btn-success">Submit</button>
        </div>
    </form>
</div>

    
      
</body>

</html>
